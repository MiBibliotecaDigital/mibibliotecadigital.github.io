<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title></title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.boot-message{min-height:100vh;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;color:#526174;font:14px system-ui;background:#f5f7f8}
.boot-message strong{color:#17243b;font-size:18px}
.boot-message button{justify-self:center;border:0;border-radius:8px;background:#17243b;color:#fff;padding:10px 16px;cursor:pointer}
</style>
</head>
<body>
<div id="app"><div class="boot-message"><strong>Mi Biblioteca Digital</strong><span>Iniciando sesión segura y preparando la biblioteca…</span></div></div>
<script>
(function(){
  function showBootError(){
    if(window.__BIBLIOTECA_READY__)return;
    var root=document.getElementById('app');
    if(!root)return;
    root.innerHTML='<div class="boot-message"><strong>No se pudo iniciar la biblioteca</strong><span>Falló la carga de un componente. Recargá la página; tus libros y archivos no fueron modificados.</span><button onclick="location.reload()">Volver a cargar</button></div>';
  }
  window.addEventListener('error',showBootError,true);
  window.addEventListener('unhandledrejection',showBootError,true);
})();
</script>
<script src="js/config.js"></script>
<script type="module" src="js/app.js" onerror="document.getElementById('app').innerHTML='<div class=&quot;boot-message&quot;><strong>No se pudo cargar la aplicación</strong><span>Revisá tu conexión y volvé a cargar.</span><button onclick=&quot;location.reload()&quot;>Volver a cargar</button></div>'"></script>
</body>
</html>
