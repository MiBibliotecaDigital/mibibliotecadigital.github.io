<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title></title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.boot-message{min-height:100vh;display:grid;place-content:center;gap:10px;text-align:center;padding:24px;color:#526174;font:14px system-ui;background:#f5f7f8}
.boot-message strong{color:#17243b;font-size:18px}
.boot-message button{justify-self:center;border:0;border-radius:8px;background:#17243b;color:#fff;padding:10px 16px;cursor:pointer}
</style>
</head>
<body>
<div id="app"><div class="boot-message"><strong>Mi Biblioteca Digital</strong><span>Iniciando sesión segura y preparando la biblioteca…</span></div></div>
<script>
(function(){
  function showBootError(event){
    if(window.__BIBLIOTECA_READY__)return;
    // Ignore failed stylesheets, fonts, images and other resource-load events.
    if(event && event.target && event.target !== window)return;
    var root=document.getElementById('app');
    if(!root)return;
    var detail='';
    if(event && event.type==='error'){
      detail=(event.message||'Error de JavaScript')+
        (event.filename?' · '+event.filename.split('/').slice(-1)[0]:'')+
        (event.lineno?':'+event.lineno:'');
    }else if(event && event.reason){
      detail=event.reason.message||String(event.reason);
    }
    root.innerHTML='<div class="boot-message"><strong>No se pudo iniciar la biblioteca</strong><span></span><button onclick="location.reload()">Volver a cargar</button></div>';
    root.querySelector('.boot-message span').textContent=detail||'Falló la inicialización. Tus libros y archivos no fueron modificados.';
    console.error('Mi Biblioteca startup diagnostic:',event);
  }
  window.addEventListener('error',showBootError);
  window.addEventListener('unhandledrejection',showBootError);
})();
</script>
<script src="js/config.js"></script>
<script type="module" src="js/app.js?v=20261127-googlebooks-isbnlab-auto1" onerror="document.getElementById('app').innerHTML='<div class=&quot;boot-message&quot;><strong>No se pudo cargar la aplicación</strong><span>Falló la descarga de app.js o de su dependencia de Supabase. Revisá la conexión y volvé a cargar.</span><button onclick=&quot;location.reload()&quot;>Volver a cargar</button></div>'"></script>
</body>
</html>
