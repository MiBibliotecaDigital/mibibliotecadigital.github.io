name: Validate JavaScript source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare Worker syntax
        run: node --check --input-type=module < cloudflare/worker.js
      - name: Check browser application syntax
        run: node --check --input-type=module < js/app.js
