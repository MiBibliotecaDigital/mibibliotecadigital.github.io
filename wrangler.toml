name = "mibibliotecadigital-pdf-gateway"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-27"
workers_dev = true

# Public runtime configuration. The Supabase publishable key is intended for
# browser/client use; never place service_role or R2 secret keys in this file.
[vars]
APP_ORIGIN = "https://mibibliotecadigital.github.io"
COVER_GATEWAY_ORIGIN = "https://mibibliotecadigital-pdf-gateway.testeosintensos.workers.dev"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_O5T6pg0Gtp93f7zz-fI8hQ_nFjaUAMl"
SUPABASE_URL = "https://eiphspzvujrblldzbfwn.supabase.co"

# Thumbnail generation runs manually from the authenticated administrator's browser.

# Bind the private R2 bucket. Do not enable a public R2 URL or custom domain.
[[r2_buckets]]
binding = "BIBLIOTECA"
bucket_name = "biblioteca-digital-archivos"

# Required secret: ISBNLab API token (set in Cloudflare Dashboard or with
# `npx wrangler secret put ISBNLAB_API_TOKEN`; never commit its value).
[secrets]
required = ["ISBNLAB_API_TOKEN"]

# Google Books uses the public book-search page at google.es (tbm=bks); no API key is required.
